# proxy: речевые признаки, не возраст; тестовые строки придуманы.
youth_slang:
- regex: \b(?:кринж\w*|рофл\w*|лол|чел(?:ы|а|у|ом)?|имба|вайб\w*|жиза|треш|зашквар\w*)\b
  positive:
  - это кринж
  - чел серьезно
  negative:
  - человек идет
  - кринолин
- regex: \b(?:база|базированно|краш|флекс\w*)\b
  positive:
  - вот это база
  - сплошной флекс
  negative:
  - базальт
  - окраска
chat_orthography:
- regex: (?:\b(?:(?:ах){2,}а*|(?:ха){2,}|спс|пж|кста|ваще|имхо)\b|\){2,})
  positive:
  - ахах
  - хахаха
  - ясно))
  negative:
  - спасибо
  - ясно)
- regex: ^[а-яa-z0-9]+(?:\s+[а-яa-z0-9]+){5,}$
  raw_case: true
  positive:
  - это просто текст из шести слов
  - я тут давно живу и все вижу
  negative:
  - Это просто текст из шести слов
  - это просто текст из шести слов.
older_register:
- regex: \b(?:уважаем(?:ые|ый|ая)|господа|увы|благодарю|с уважением|товарищи|в наше
    время)\b
  positive:
  - увы все так
  - благодарю за ответ
  negative:
  - уважение к людям
  - товарищество
- regex: (?:\.{4,}|,{2,})
  positive:
  - печально....
  - да,, так
  negative:
  - печально...
  - да, так
generation_mention:
- regex: \b(?:зумер\w*|бумер\w*|скуф\w*|молодеж\w*|старик\w*|пенсионер\w*)\b
  positive:
  - эта молодежь
  - опять зумеры
  negative:
  - молодой дом
  - старинный дом
self_age:
- regex: \b(?:мне\s+(?:сейчас\s+|уже\s+)?\d{1,3}\s*(?:лет|год\w*)|я\s+(?:пенсионер(?:ка)?|студент(?:ка)?|школьни[кц]а?|зумер|бумер)|я\s+(?:родился|родилась)\s+в\s+\d{4})\b
  positive:
  - мне уже 40 лет
  - я родилась в 1980 году
  - я студентка
  negative:
  - ему 40 лет
  - пенсионеры идут
- regex: \b(?:мне\s+(?:сейчас\s+|уже\s+)?\d{2})(?=\s*[,!.?]|$)|\bв\s+свои\s+\d{1,3}\s+год[ау]?\b|\bя\s+родил(?:ся|ась)[^.!?\n]{0,30}\bв\s+\d{2,4}\s+году\b
  positive:
  - сейчас мне 36, вот так
  - в свои 22 года
  - я родился в москве в 75 году
  negative:
  - мне 36 рублей
  - ему 22 года
self_resident:
- regex: \b(?:я\s+(?:сам(?:а)?\s+)?(?:живу|жил|жила|проживаю)|живу\s+(?:тут|здесь|рядом|недалеко|на|в)|мы\s+живем|я\s+местн(?:ый|ая)|мой\s+район)\b
  positive:
  - я живу рядом
  - живу на соседней улице
  negative:
  - они живут рядом
  - жить тут хорошо
self_worked:
- regex: \b(?:я\s+(?:там\s+|здесь\s+|тут\s+)?работал[а]?|работал[а]?\s+(?:там|тут|здесь|на\s+(?:этом\s+)?(?:заводе|электрозаводе)))\b
  positive:
  - я там работала
  - работал на электрозаводе
  negative:
  - они работали на заводе
  - завод работал давно
- regex: \bя\s+(?:проработал[а]?|поработал[а]?|подрабатывал[а]?)\b|\b(?:работал[а]?|поработать)\s+(?:в\s+помещении\s+электрозавода|на\s+территории\s+электрозавода)\b
  positive:
  - я проработала на заводе
  - довелось поработать на территории электрозавода
  negative:
  - он проработал на заводе
  - работа на заводе
family_worked:
- regex: \b(?:мама|папа|отец|мать|дед|дедушка|бабушка|родители|муж|жена)\b[^.!?\n]{0,60}\bработал[аи]?\b
  positive:
  - мой отец тут работал
  - бабушка работала на заводе
  negative:
  - отец пришел
  - завод работал
childhood_memory:
- regex: \b(?:я\s+(?:здесь\s+|тут\s+)?(?:вырос|выросла|рос|росла)|(?:в|с|из)\s+детств[аео]|мое\s+детство)\b
  positive:
  - я здесь вырос
  - ходил сюда в детстве
  negative:
  - детский сад
  - детство детей
